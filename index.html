<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<title>Hanaseru</title>
<style>
  :root{ --bg:#f6f5f1; --card:#ffffff; --ink:#1c2b2a; --sub:#5c6b6a;
         --teal:#0f766e; --teal-d:#0b5a54; --amber:#c2740a; --line:#e4e2db; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
        line-height:1.6; }
  .wrap{ max-width:640px; margin:0 auto; padding:16px; padding-block:16px;
         min-height:100dvh; display:flex; flex-direction:column; }
  header{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .logo{ font-weight:800; font-size:22px; letter-spacing:.02em; color:var(--teal); }
  .logo small{ color:var(--sub); font-weight:600; font-size:12px; margin-left:6px; }
  .pill{ font-size:13px; color:var(--sub); background:#fff; border:1px solid var(--line);
         padding:4px 10px; border-radius:999px; white-space:nowrap; }
  section{ flex:1; display:flex; flex-direction:column; }
  h2{ font-size:16px; margin:8px 0 4px; }
  .muted{ color:var(--sub); font-size:14px; }
  .stat{ font-size:14px; color:var(--sub); margin:2px 0; }
  .grid{ display:grid; gap:10px; margin-top:14px; }
  button{ font:inherit; cursor:pointer; border:none; border-radius:14px; }
  .choice{ text-align:left; background:#fff; border:1px solid var(--line);
           padding:16px 18px; font-size:17px; color:var(--ink);
           display:flex; justify-content:space-between; align-items:center; }
  .choice b{ color:var(--teal); }
  .choice span{ color:var(--sub); font-size:13px; font-weight:400; }
  .choice:active{ background:#f0efe9; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:20px;
         padding:26px 22px; flex:1; display:flex; flex-direction:column;
         justify-content:center; box-shadow:0 1px 0 rgba(0,0,0,.02); }
  .counter{ text-align:center; color:var(--sub); font-size:13px; margin-bottom:10px; }
  .ja{ font-size:24px; font-weight:700; letter-spacing:.01em; }
  .front .hint{ margin-top:20px; color:var(--sub); font-size:13px; }
  .ja-sm{ font-size:16px; color:var(--sub); }
  .en{ font-size:26px; font-weight:700; color:var(--teal-d); margin:14px 0 6px; }
  .row{ display:flex; gap:10px; margin-top:16px; }
  .row button{ flex:1; padding:16px; font-size:17px; font-weight:700; }
  .ok{ background:var(--teal); color:#fff; }
  .ng{ background:#fff; color:var(--amber); border:1px solid var(--line); }
  .speak{ background:#eef4f3; color:var(--teal-d); border:1px solid var(--line);
          padding:10px 14px; font-size:15px; font-weight:600; border-radius:12px; align-self:flex-start; }
  .bar{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .link{ background:none; color:var(--sub); font-size:14px; padding:8px; }
  .big{ padding:16px; font-size:17px; font-weight:700; background:var(--teal); color:#fff; }
  .center{ text-align:center; }
  footer{ text-align:center; color:var(--sub); font-size:12px; margin-top:14px; }
  .speakrow{ display:flex; gap:8px; }
  textarea{ width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:12px; resize:vertical; background:#fff; color:var(--ink); }
  .capitem{ display:flex; justify-content:space-between; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:6px; font-size:15px; }
  .capitem span{ flex:1; }
  .capx{ background:none; color:var(--sub); font-size:18px; padding:2px 8px; line-height:1; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:14px; color:var(--sub); }
  .chip.on{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .clrow{ display:flex; align-items:flex-start; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:6px; }
  .clcheck{ background:none; font-size:22px; line-height:1.2; color:var(--sub); padding:0 2px; }
  .clcheck.on{ color:var(--teal); }
  .cltext{ flex:1; cursor:pointer; }
  .clja{ font-size:16px; }
  .clen{ font-size:16px; font-weight:700; color:var(--teal-d); margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Hanaseru<small>話せる</small></div>
    <div class="pill" id="streak">連続 0 日</div>
  </header>

  <!-- 範囲えらび -->
  <section id="setup">
    <h2>今日の練習</h2>
    <p class="stat" id="progress">身についた：0 / 0</p>
    <p class="muted">日本語を見て、その瞬間に英語で声に出す。詰まった行は翌日また出ます。</p>
    <div class="grid">
      <button class="choice" data-action="start" data-domain="travel"><span>いま困っている</span><b>旅行・日常 ▸</b></button>
      <button class="choice" data-action="start" data-domain="medical"><span>診察室で</span><b>診療英語 ▸</b></button>
      <button class="choice" data-action="start" data-domain="sign"><span>院長の型</span><b>署名フレーズ ▸</b></button>
      <button class="choice" data-action="start" data-domain="all"><span>まとめて</span><b>ぜんぶ ▸</b></button>
      <button class="choice" data-action="start" data-domain="mine"><span>私が保存した言い方</span><b>🔖 保存フレーズ ▸</b></button>
    </div>
    <div class="grid" style="margin-top:10px">
      <button class="choice" data-action="shadow"><span>手本を聞いて追いかける</span><b>🎧 シャドーイング ▸</b></button>
      <button class="choice" data-action="checklist"><span>覚えたかでなく、見た所にチェック</span><b>📋 チェックリスト ▸</b></button>
      <button class="choice" data-action="capOpen"><span>思いついたら貯める</span><b>＋ 言いたいこと ▸</b></button>
    </div>
    <div id="capBox" hidden style="margin-top:8px">
      <textarea id="capInput" rows="2" placeholder="日本語で「これ言いたい」を書く（英語はあとで私が入れます）"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="ng" data-action="capCancel">閉じる</button>
        <button class="ok" data-action="capSave">ためる</button>
      </div>
      <div id="capList"></div>
      <button class="link" id="capCopyBtn" data-action="capCopy" hidden>📋 ためた分を全部コピー（Claudeに貼って英語化）</button>
    </div>
    <footer>この端末にだけ進捗を保存（オフラインOK）</footer>
  </section>

  <!-- 学習 -->
  <section id="study" hidden>
    <div class="counter" id="counter">1 / 12</div>
    <!-- 表：日本語 -->
    <div class="card front" id="cardFront">
      <div class="ja" id="ja"></div>
      <div class="hint">声に出したら、タップして答え合わせ 👆</div>
    </div>
    <!-- 裏：英語 -->
    <div class="card" id="cardBack" hidden>
      <div class="ja-sm" id="jaBack"></div>
      <div class="en" id="en"></div>
      <div class="speakrow">
        <button class="speak" data-action="speak">🔊 もう一度きく</button>
        <button class="speak rateBtn" data-action="rate" id="rateBtn">🐢 ゆっくり</button>
      </div>
      <div class="row">
        <button class="ng" data-action="ng">まだ</button>
        <button class="ok" data-action="ok">言えた</button>
      </div>
    </div>
    <div class="bar"><button class="link" data-action="home">← 範囲を選ぶ</button></div>
  </section>

  <!-- 完了 -->
  <section id="done" hidden>
    <div class="card center">
      <div class="ja" data-msg>今日の練習、完了です。</div>
      <p class="stat" id="doneStat" style="margin-top:14px"></p>
    </div>
    <div class="grid">
      <button class="big" data-action="home">範囲を選ぶ</button>
    </div>
  </section>

  <!-- チェックリスト -->
  <section id="checklist" hidden>
    <div id="clChips" class="chips">
      <button class="chip" data-action="clDomain" data-domain="travel">旅行</button>
      <button class="chip" data-action="clDomain" data-domain="medical">診療</button>
      <button class="chip" data-action="clDomain" data-domain="sign">署名</button>
      <button class="chip" data-action="clDomain" data-domain="mine">🔖保存</button>
      <button class="chip" data-action="clDomain" data-domain="all">ぜんぶ</button>
    </div>
    <p class="stat" id="clCount" style="margin:8px 0 2px"></p>
    <p class="muted" style="font-size:13px">タップで英語＋音声。チェックは「見た・練習した」印です（覚えたかのテストではありません）。</p>
    <div id="clList"></div>
    <div class="bar"><button class="link" data-action="home">← 範囲を選ぶ</button></div>
  </section>

  <!-- シャドーイング -->
  <section id="shadow" hidden>
    <div id="shChips" class="chips">
      <button class="chip" data-action="shDomain" data-domain="travel">旅行</button>
      <button class="chip" data-action="shDomain" data-domain="medical">診療</button>
      <button class="chip" data-action="shDomain" data-domain="sign">署名</button>
      <button class="chip" data-action="shDomain" data-domain="mine">🔖保存</button>
      <button class="chip" data-action="shDomain" data-domain="all">ぜんぶ</button>
    </div>
    <div class="counter" id="shCounter"></div>
    <div class="card" style="justify-content:center">
      <div class="en" id="shEn" style="text-align:center"></div>
      <div class="ja-sm" id="shJa" style="text-align:center; margin-top:10px"></div>
      <p class="muted" style="text-align:center; margin-top:18px; font-size:13px">手本を聞いて、少し遅れて追いかけて声に出す（シャドーイング）。<br>スピーキング力＋訛りに強くなる。</p>
      <div class="speakrow" style="justify-content:center; margin-top:10px">
        <button class="speak" data-action="shadowReplay">🔊 もう一度</button>
        <button class="speak rateBtn" data-action="rate">🐢 ゆっくり</button>
      </div>
    </div>
    <div class="row">
      <button class="ng" data-action="shadowPrev">← 前</button>
      <button class="ok" data-action="shadowNext">次 →</button>
    </div>
    <div class="bar"><button class="link" data-action="home">← 範囲を選ぶ</button></div>
  </section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
